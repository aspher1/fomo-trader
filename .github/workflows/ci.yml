name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: setup.sh
      - name: Install test and application dependencies
        run: python -m pip install pytest requests solders bip-utils web3 base58
      - name: Run offline tests (never start live trading)
        env:
          PYTHONPATH: .
        run: python -m pytest -q
